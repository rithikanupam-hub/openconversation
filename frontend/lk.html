<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OpenConversation M1</title>
<style>
  :root { --bg: #ece9e2; --ink: #17140f; --orange: #ff5a1f; --card: #fff; --dim: #6b655c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141210; --ink: #f2eee8; --card: #201d1a; --dim: #a39d94; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--dim); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  button { background: var(--orange); color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--dim); }
  button:disabled { opacity: .5; cursor: default; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  #status { color: var(--dim); }
  #stats { font: 12px/1.4 ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; margin: 8px 0 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .card .src { color: var(--dim); font-size: 13px; }
  .card .tgt { font-weight: 600; }
  .card.native { opacity: .55; }
</style>
</head>
<body>
<main>
  <h1>OpenConversation: WebRTC test (M1)</h1>
  <p class="sub">Talks to the translator agent through LiveKit. Italian in, English out in the cloned voice.</p>
  <div class="row">
    <label><input type="checkbox" id="consent" checked /> I have the speaker's permission to clone their voice</label>
  </div>
  <div class="row">
    <button id="start">Start listening</button>
    <button id="reset" class="ghost" disabled>Reset voice</button>
    <span id="status">not connected</span>
  </div>
  <div id="voice">voice: not captured yet</div>
  <div id="stats"></div>
  <div id="feed"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script>
(() => {
  const LK = window.LivekitClient;
  const $ = (id) => document.getElementById(id);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const cards = new Map();
  // Exposed for tests: WebRTC's own view of the translated audio (concealment = gaps it had to fill).
  window.__oc = { events: [], stats: [] };
  let room = null, agentTrack = null;

  const send = (obj) => room && room.localParticipant.publishData(enc.encode(JSON.stringify(obj)), { reliable: true, topic: "control" });
  const status = (t) => { $("status").textContent = t; };

  function card(id) {
    if (!cards.has(id)) {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = '<div class="src"></div><div class="tgt">…</div>';
      $("feed").prepend(el);
      cards.set(id, el);
    }
    return cards.get(id);
  }

  function onEvent(m) {
    window.__oc.events.push([Math.round(performance.now()), m]);
    if (m.type === "segment") {
      const el = card(m.id);
      if (m.source_text) el.querySelector(".src").textContent = `${m.source_lang || ""} · ${m.source_text}`;
      if (m.skipped === "same_language") { el.classList.add("native"); el.querySelector(".tgt").textContent = "no translation needed"; }
      else if (m.target_text) el.querySelector(".tgt").textContent = m.target_text;
    } else if (m.type === "voice") {
      $("voice").textContent = m.state === "locked" ? `voice locked (${m.seconds}s)` :
        m.seconds ? `capturing voice… ${m.seconds}s of ${m.needed}s` : "voice: not captured yet";
    } else if (m.type === "status") {
      status(m.state + (m.detail ? ` · ${m.detail}` : ""));
    } else if (m.type === "error") {
      status("error: " + m.message);
    }
  }

  async function pollStats() {
    if (!agentTrack || !agentTrack.receiver) return;
    const report = await agentTrack.receiver.getStats();
    report.forEach((s) => {
      if (s.type !== "inbound-rtp" || s.kind !== "audio") return;
      const total = s.totalSamplesReceived || 0, conc = s.concealedSamples || 0, silent = s.silentConcealedSamples || 0;
      const row = { t: Math.round(performance.now()), total, concealed: conc, silentConcealed: silent,
        events: s.concealmentEvents || 0, jitterMs: Math.round((s.jitter || 0) * 1000),
        bufferMs: s.jitterBufferEmittedCount ? Math.round(1000 * s.jitterBufferDelay / s.jitterBufferEmittedCount) : 0,
        kbps: 0, bytes: s.bytesReceived || 0 };
      const prev = window.__oc.stats[window.__oc.stats.length - 1];
      if (prev) row.kbps = Math.round(8 * (row.bytes - prev.bytes) / Math.max(1, row.t - prev.t));
      window.__oc.stats.push(row);
      $("stats").textContent = `audio in: ${row.kbps} kbps · jitter ${row.jitterMs} ms · buffer ${row.bufferMs} ms\n` +
        `gaps filled by WebRTC (non-silent concealment): ${((conc - silent) / 48000).toFixed(2)} s in ${row.events} events`;
    });
  }

  async function start() {
    $("start").disabled = true;
    status("connecting…");
    const ident = "listener-" + Math.random().toString(36).slice(2, 7);
    const { url, token } = await (await fetch(`/api/lk-token?identity=${ident}`)).json();
    room = new LK.Room({ adaptiveStream: false, dynacast: false });
    room.on(LK.RoomEvent.TrackSubscribed, (track, pub, participant) => {
      if (track.kind !== "audio") return;
      agentTrack = track;
      document.body.appendChild(track.attach());
    });
    room.on(LK.RoomEvent.DataReceived, (payload, participant, kind, topic) => {
      if (topic !== "events") return;
      try { onEvent(JSON.parse(dec.decode(payload))); } catch (e) {}
    });
    room.on(LK.RoomEvent.Disconnected, () => status("disconnected"));
    await room.connect(url, token);
    await room.startAudio();
    await room.localParticipant.setMicrophoneEnabled(true, { echoCancellation: true, noiseSuppression: true, autoGainControl: true });
    // A fresh Start is a new conversation: forget the previous voice.
    const cfg = { type: "config", source_lang: "auto", target_lang: "en", consent: $("consent").checked, clone: $("consent").checked };
    setTimeout(() => { send(cfg); send({ type: "reset_voice" }); }, 1500);
    $("reset").disabled = false;
    status("listening");
    setInterval(pollStats, 1000);
  }

  $("start").onclick = () => start().catch((e) => { status("failed: " + e.message); $("start").disabled = false; });
  $("reset").onclick = () => send({ type: "reset_voice" });
  $("consent").onchange = () => send({ type: "config", consent: $("consent").checked, clone: $("consent").checked });
})();
</script>
</body>
</html>
